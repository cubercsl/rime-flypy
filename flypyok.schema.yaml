# Rime schema settings
# encoding: utf-8

schema:
  schema_id: flypyok
  name: 小鹤音形 ok 拼字
  version: "10.26.1"

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz'"
  initials: "abcdefghijklmnopqrstuvwxyz"
  max_code_length: 6

translator:
  dictionary: flypyok
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
