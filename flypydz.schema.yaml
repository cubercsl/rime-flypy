# Rime schema settings
# encoding: utf-8

schema:
  schema_id: flypydz
  name: 小鹤音形反查
  version: "10.26.1"
  author:
    - 方案设计：何海峰 flypy.cc
  description: |
    小鹤音形输入法反查单字词库

switches:
  - name: ascii_mode
    reset: 0
    states: [ CN, EN ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - reverse_lookup_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: '/;zyxwvutsrqponmlkjihgfedcba'
  initials: 'abcdefghijklmnopqrstuvwxyz;'
  finals: '/'
  max_code_length: 4
  auto_select: true
  auto_select_pattern: ^;.$|^\w{4}$
  algebra:
    - derive/^.(.*)$/`$1/
    - derive/^(.).(.*)$/$1`$2/
    - derive/^(..).(.*)$/$1`$2/
    - derive/^(...).$/$1`/

translator:
  dictionary: flypydz
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  inherit: false
  preedit_format:
    - xform/^`(.*)/$1/

reverse_lookup:
  dictionary: flypydz
  inherit: false
  enable_user_dict: false
  enable_sentence: false
  enable_completion: false
  enable_charset_filter: false
  enable_encoder: false
  filter: '^(?!.*\bok)'
  comment_format:
    - xform/ / /
